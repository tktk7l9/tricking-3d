  <body>
    <style>
      #title-overlay {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, #1a2030, #0a0b14);
        color: #e6ecf3;
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
        text-align: center;
        padding: 24px;
      }
      #title-overlay h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 48px);
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      #title-overlay .tag {
        font-size: 13px;
        letter-spacing: 0.24em;
        color: #b6bdca;
        margin-bottom: 28px;
        text-transform: uppercase;
      }
      #title-overlay p {
        max-width: 480px;
        font-size: 14px;
        line-height: 1.7;
        color: #c8d0db;
        margin: 0 0 28px;
      }
      #title-start {
        background: #58a4ff;
        color: #0a0b14;
        border: none;
        padding: 14px 36px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.18em;
        cursor: pointer;
        text-transform: uppercase;
      }
      #title-start:hover { background: #79b6ff; }
      #title-start:disabled { opacity: 0.6; cursor: progress; }
    </style>
    <div id="app">
      <aside id="sidebar"></aside>
      <main id="viewport">
        <canvas id="canvas"></canvas>
        <div id="hud-top"></div>
        <div id="hud-camera"></div>
        <div id="hud-overlays"></div>
      </main>
      <aside id="info"></aside>
      <footer id="timeline"></footer>
    </div>
    <div id="title-overlay">
      <h1>Tricking 3D Analyzer</h1>
      <div class="tag">Three.js Trick Motion Viewer</div>
      <p>トリッキング/パルクールの20技を3Dで再生・スクラブ・回転軸表示・重心軌跡可視化で詳細に分析できます。</p>
      <button id="title-start" type="button">Analyze Start</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
